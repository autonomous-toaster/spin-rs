repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -Dwarnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-machete
        name: cargo machete
        entry: cargo machete
        language: system
        pass_filenames: false
        types: [rust]

      - id: hadolint
        name: hadolint Dockerfile
        entry: hadolint
        language: system
        files: Dockerfile
        pass_filenames: true

