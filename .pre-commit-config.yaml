repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -Dwarnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-machete
        name: cargo machete
        entry: cargo machete
        language: system
        pass_filenames: false
        types: [rust]

      - id: hadolint
        name: hadolint Dockerfile
        entry: hadolint
        language: system
        files: Dockerfile
        pass_filenames: true

      - id: cargo-crap
        name: cargo crap (coverage gate)
        # NOTE: runs the full test suite — may take 1-2 min on first run.
        # Threshold 30 with --allow for 3 functions whose untestable branches
        # cannot be reached through the current Promela parser:
        #   - special_expr_to_lua: NFull/NEmpty/Timeout expression types
        #   - run: trail-save path requires >5 errors
        #   - emit_stmts: Unless/DStep/Label statement types
        entry: bash -c
          'set -e &&
          cargo llvm-cov --workspace --lcov
          --output-path /tmp/lcov-precommit.info
          --lib --bins --tests &&
          cargo crap --lcov /tmp/lcov-precommit.info
          --threshold 30
          --allow "LuaGenerator::special_expr_to_lua"
          --allow "run"
          --allow "LuaGenerator::emit_stmts"
          --exclude "tests/**"
          --fail-above'
        language: system
        pass_filenames: false
        types: [rust]
