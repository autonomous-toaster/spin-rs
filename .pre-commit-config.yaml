repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -Dwarnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-machete
        name: cargo machete
        entry: cargo machete
        language: system
        pass_filenames: false
        types: [rust]

      - id: hadolint
        name: hadolint Dockerfile
        entry: hadolint
        language: system
        files: Dockerfile
        pass_filenames: true

      - id: cargo-crap
        name: cargo crap (coverage gate)
        # NOTE: runs the full test suite — may take 1-2 min on first run.
        # No live DB required: --features integration is omitted.
        # Threshold 65 allows ~6 inherently complex functions
        # (CLI entry point, codegen, runtime) that cannot be further simplified.
        entry: bash -c
          'set -e &&
          cargo llvm-cov --workspace --lcov
          --output-path /tmp/lcov-precommit.info
          --lib --bins --tests &&
          cargo crap --lcov /tmp/lcov-precommit.info
          --threshold 65
          --exclude "tests/**"
          --fail-above'
        language: system
        pass_filenames: false
        types: [rust]
