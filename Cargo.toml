[package]
name = "spin-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust-native Promela model checker with Lua runtime"
license = "WTFPL"

[dependencies]
# Parser
nom = { version = "7", features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Hashing
fxhash = "0.2"

# Lua runtime
mlua = { version = "0.10", features = [
  "lua54",
  "vendored",
  "send",
], optional = true }

# Error handling
anyhow = "1"

# Parallel verification
rayon = { version = "1", optional = true }
crossbeam = { version = "0.8" }
dashmap = { version = "6" }

# Logging
log = "0.4"
env_logger = "0.11"

[features]
default = ["lua-runtime"]
lua-runtime = ["dep:mlua"]
parallel = ["dep:rayon"]
bench = []

[package.metadata.cargo-machete]
ignored = ["rayon"]
